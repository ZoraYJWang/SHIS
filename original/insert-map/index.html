<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Somaliland HIS - Interactive Map</title>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            font-family: 'Inter', sans-serif; 
            height: 100vh;
            overflow: hidden;
        }
        
        #map-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        
        #map {
            width: 100%;
            height: 100%;
            background-color: #000; /* 地圖載入前的底色 */
        }
        
        .tabs {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 15px 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .tabs-title {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .tab {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            border-radius: 50%;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }
        
        .tab.active {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.7);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            transform: scale(1.08);
        }
        
        .hospital-label {
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(0, 255, 204, 0.5);
            white-space: nowrap;
        }

        .info-card {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 15px 10px;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .info-card-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 8px;
        }

        .info-card-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-card-list li {
            color: #ffffff;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.4;
        }

        .info-card-list li:last-child {
            border-bottom: none;
        }

        .info-card-list li:hover {
            background: rgba(255, 255, 255, 0.1);
            padding-left: 5px;
            transition: all 0.2s ease;
        }

        .info-card-list li .region {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div id="map-container">
    <div id="map"></div>
    <div class="tabs">
        <div class="tabs-title">Phase</div>
        <div class="tab active" data-tier="1">1</div>
        <div class="tab" data-tier="2">2</div>
        <div class="tab" data-tier="3">3</div>
        <div class="tab" data-tier="all">All</div>
    </div>
    <div class="info-card">
        <div class="info-card-title">Phase 1 Hospitals</div>
        <ul class="info-card-list" id="hospital-list"></ul>
    </div>
</div>

<script>
    // --- 1. 資料定義區 ---
    const tierData = {
        1: [
            { name: "Hargeisa Group Hospital", coords: [44.0573, 9.5606], region: "Woqooyi Galbeed" },
            { name: "Burao General Hospital", coords: [45.5342, 9.5215], region: "Togdheer" },
            { name: "Borama Regional Hospital", coords: [43.1843, 9.9361], region: "Awdal" },
            { name: "Berbera Regional Hospital", coords: [45.0111, 10.4362], region: "Sahil" },
            { name: "Erigavo General Hospital", coords: [47.3686, 10.6158], region: "Sanaag" },
            { name: "Gabiley General Hospital", coords: [43.6235, 9.7025], region: "Woqooyi Galbeed" },
            { name: "MAS Children's Hospital", coords: [44.0575, 9.6226], region: "Woqooyi Galbeed" },
            { name: "Salahlay Hospital", coords: [44.1524, 9.1895], region: "Woqooyi Galbeed" },
            { name: "Baligubadle District Hospital", coords: [43.8821, 9.1125], region: "Woqooyi Galbeed" }
        ],
        2: [
            { name: "Sheikh District Hospital", coords: [45.1883, 9.9282], region: "Sahil" },
            { name: "Lasanod Hospital", coords: [47.3633, 8.9833], region: "Sool" },
            { name: "Odwayne Hospital", coords: [45.0667, 9.4000], region: "Togdheer" },
            { name: "Buhoodle Hospital", coords: [46.3274, 8.4500], region: "Sool" },
            { name: "Saylac Hospital", coords: [43.4500, 11.0000], region: "Salel" },
            { name: "Caynaba Hospital", coords: [44.7833, 10.3833], region: "Saraar" },
            { name: "Badhan Hospital", coords: [48.4833, 10.9833], region: "Badhan" },
            { name: "Wajale Hospital", coords: [43.4500, 9.5800], region: "Gabiley" },
            { name: "Arabsiyo District Hospital", coords: [43.9000, 9.7000], region: "Gabiley" }
        ],
        3: [
            { name: "Kalabaydh District Hospital", coords: [43.4760, 9.6740], region: "Gabiley" },
            { name: "Lughaya Hospital", coords: [43.2000, 10.7000], region: "Awdal" },
            { name: "Hariirad Hospital", coords: [43.4000, 10.9000], region: "Salel" },
            { name: "Dilla Hospital", coords: [43.3167, 10.0667], region: "Awdal" },
            { name: "Sabawanaag Hospital", coords: [44.1333, 9.1000], region: "Maroodijeex" },
            { name: "Eel-Afweyn Hospital", coords: [47.2000, 9.9333], region: "Sanaag" },
            { name: "Dhahar Hospital", coords: [47.8167, 10.7833], region: "Sanaag" },
            { name: "Daryeel Hospital", coords: [44.0333, 9.5500], region: "Maroodijeex" },
            { name: "Garbo Dadar Hospital", coords: [43.3833, 10.4833], region: "Awdal" },
            { name: "Widh Widh Hospital", coords: [46.4833, 8.8500], region: "Sool" },
            { name: "Awr Boogays Hospital", coords: [47.1667, 9.0667], region: "Sool" },
            { name: "Mass Pediatric Hospital", coords: [44.0500, 9.6000], region: "Maroodijeex" },
            { name: "Trauma and Orthopedic Hospital", coords: [45.0167, 10.4333], region: "Sahil" },
            { name: "Burco Maternal and Child Health", coords: [45.5330, 9.5180], region: "Togdheer" },
            { name: "Hargeisa TB Hospital", coords: [44.0333, 9.5500], region: "Maroodijeex" },
            { name: "Gabiley TB Hospital", coords: [43.6210, 9.7000], region: "Gabiley" },
            { name: "Mandhaye Hospital", coords: [45.5300, 9.5200], region: "Togdheer" },
            { name: "Gabiley Mental Hospital", coords: [43.6260, 9.7050], region: "Gabiley" },
            { name: "Borama Fistula Hospital", coords: [43.1833, 9.9333], region: "Awdal" }
        ]
    };

    // 定義各階層顏色對照表
    const phaseColors = {
        1: { fill: '#10B981', stroke: '#ffffff' }, // 翠綠
        2: { fill: '#06B6D4', stroke: '#ffffff' }, // 青色
        3: { fill: '#9CA3AF', stroke: '#ffffff' }  // 灰
    };

    // --- 2. 初始化地圖與底圖 ---
    const map = L.map('map', {
        zoomControl: false,
        zoomSnap: 0.25,
        wheelZoomPrecision: 0.25
    }).setView([9.6, 46.5], 7.5);
    
    // Add zoom control to bottom right
    L.control.zoom({
        position: 'bottomright'
    }).addTo(map);
    
    let hospitalMarkers = [];
    let regionLayers = [];

    // 加入 Esri 衛星雲圖 (底層)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        maxZoom: 18
    }).addTo(map);

    // --- 3. 核心功能：顯示醫院點位 ---
    function showHospitals(phase) {
        // 清除舊標記
        hospitalMarkers.forEach(marker => map.removeLayer(marker));
        hospitalMarkers = [];
        
        let hospitalsToShow;
        
        if (phase === 'all') {
            // 顯示所有階層的醫院
            hospitalsToShow = [
                ...tierData[1].map(h => ({...h, phase: 1})),
                ...tierData[2].map(h => ({...h, phase: 2})),
                ...tierData[3].map(h => ({...h, phase: 3}))
            ];
        } else {
            // 顯示特定階層的醫院
            hospitalsToShow = tierData[phase].map(h => ({...h, phase: phase}));
        }

        // 畫出新標記
        hospitalsToShow.forEach(hospital => {
            const currentColor = phaseColors[hospital.phase];
            
            // 座標轉換：資料是 [lng, lat]，Leaflet 需要 [lat, lng]
            const marker = L.circleMarker([hospital.coords[1], hospital.coords[0]], {
                radius: 8,
                fillColor: currentColor.fill,
                color: currentColor.stroke,
                weight: 2,
                fillOpacity: 0.9,
                opacity: 1
            }).addTo(map);
            
            // 確保點位永遠在最上層
            marker.bringToFront();
            
            // 綁定 Tooltip (懸停顯示名稱)
            marker.bindTooltip(hospital.name, {
                permanent: false,
                className: 'hospital-label',
                direction: 'right',
                offset: [10, 0]
            });
            
            hospitalMarkers.push(marker);
        });

        // 更新資訊卡片
        updateInfoCard(phase);
    }

    // --- 更新資訊卡片內容 ---
    function updateInfoCard(phase) {
        const titleElement = document.querySelector('.info-card-title');
        const listElement = document.getElementById('hospital-list');
        
        // 更新標題
        if (phase === 'all') {
            titleElement.textContent = 'All Hospitals';
        } else {
            titleElement.textContent = `Phase ${phase} Hospitals`;
        }
        
        // 清空列表
        listElement.innerHTML = '';
        
        // 取得要顯示的醫院資料
        let hospitalsToShow;
        if (phase === 'all') {
            hospitalsToShow = [
                ...tierData[1].map(h => ({...h, phase: 1})),
                ...tierData[2].map(h => ({...h, phase: 2})),
                ...tierData[3].map(h => ({...h, phase: 3}))
            ];
        } else {
            hospitalsToShow = tierData[phase];
        }
        
        // 生成列表項目
        hospitalsToShow.forEach(hospital => {
            const li = document.createElement('li');
            li.innerHTML = `${hospital.name}<span class="region">${hospital.region}</span>`;
            listElement.appendChild(li);
        });
    }

    // --- 4. 載入區域邊界 GeoJSON ---
    // 注意：請確保路徑正確。如果檔案在同一層，改為 './Regions.geojson'
    fetch('../../Regions.geojson')
        .then(response => {
            if (!response.ok) throw new Error('GeoJSON load failed');
            return response.json();
        })
        .then(data => {
            const regionsLayer = L.geoJSON(data, {
                style: function() {
                    return {
                        fillColor: 'transparent',
                        weight: 1.5,
                        color: '#FFFFFF',
                        fillOpacity: 0
                    };
                },
                onEachFeature: function(feature, layer) {
                    regionLayers.push({
                        layer: layer,
                        name: feature.properties.NAM_1 || feature.properties.NAME_1 || feature.properties.admin_name
                    });
                }
            }).addTo(map);
            
            // 將邊界圖層移到底圖之上，確保不會蓋住醫院點位
            regionsLayer.bringToBack();
            
            // 載入完成後顯示 Phase 1
            showHospitals(1);
        })
        .catch(error => {
            console.warn('Regions 載入失敗 (可能是本機 CORS 限制或路徑錯誤):', error);
            // 即使邊界載入失敗，仍強制繪製醫院點位
            showHospitals(1);
        });

    // --- 5. Tabs 點擊切換事件 ---
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            // 移除所有 active 樣式
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            // 為當前點擊的 Tab 加上 active
            this.classList.add('active');
            
            // 取得 phase 數值並觸發更新
            const phase = this.getAttribute('data-tier');
            showHospitals(phase);
        });
    });
</script>
</body>
</html>
